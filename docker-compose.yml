version: '3.8'

services:
  app:
    build: .
    container_name: performance-assessment
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/hr_performance
      - MONGODB_DB_NAME=hr_performance
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=24h
      - BCRYPT_ROUNDS=12
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5000}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: performance-assessment-db
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hr_performance
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # Optional: Nginx for serving static files and reverse proxy
  nginx:
    image: nginx:alpine
    container_name: performance-assessment-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - app-network
    profiles:
      - with-nginx

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
